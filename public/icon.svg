<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="110" fill="url(#navyGrad)" />
  
  <!-- Outer Shield Trim -->
  <path d="M256 64 C350 64, 400 90, 400 180 C400 310, 290 400, 256 430 C222 400, 112 310, 112 180 C112 90, 162 64, 256 64 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#shadow)" />

  <!-- Inner Crest Shield -->
  <path d="M256 80 C336 80, 380 102, 380 185 C380 295, 285 375, 256 405 C227 375, 132 295, 132 185 C132 102, 176 80, 256 80 Z" 
        fill="#1e293b" fill-opacity="0.75" />

  <!-- Graduation Cap -->
  <polygon points="256,140 350,185 256,230 162,185" fill="url(#goldGrad)" />
  <path d="M200,210 L200,260 C200,285 312,285 312,260 L312,210" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
  <!-- Tassel -->
  <path d="M330,195 L345,245" stroke="#fef08a" stroke-width="4" stroke-linecap="round" />
  <circle cx="345" cy="250" r="5" fill="#fef08a" />

  <!-- Open Book -->
  <path d="M190,300 Q256,290 256,340 Q256,290 322,300 L322,350 Q256,340 256,380 Q256,340 190,350 Z" 
        fill="#f8fafc" stroke="url(#goldGrad)" stroke-width="4" />
  <!-- Book spine line -->
  <line x1="256" y1="340" x2="256" y2="380" stroke="#1e3a8a" stroke-width="4" />

  <!-- Star of Excellence -->
  <polygon points="256,250 262,266 279,266 265,276 270,292 256,282 242,292 247,276 233,266 250,266" fill="#fbbf24" />
</svg>
